name: Lint and Test Charts

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.6.1

      - name: Add chart repositories
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Run chart-testing (list)
        id: list
        run: |
          changed=$(ct list-changed --config .ct.yaml)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list.outputs.changed == 'true'
        run: ct lint --config .ct.yaml

      - name: Extract chart dependencies
        if: steps.list.outputs.changed == 'true'
        run: |
          # Helm dep build (run by `ct lint` and again by `ct install`)
          # stores subcharts as .tgz, but `helm install` only recognises
          # unpacked chart directories in charts/. Extract each .tgz once
          # so the install step can satisfy its dependency check; subsequent
          # `helm dependency build` invocations download fresh .tgz alongside
          # the existing directories without removing them.
          for chart_charts in charts/*/charts; do
            [ -d "$chart_charts" ] || continue
            (
              cd "$chart_charts"
              shopt -s nullglob
              for f in *.tgz; do
                tar -xzf "$f" && rm -f "$f"
              done
            )
          done

      - name: Create kind cluster
        if: steps.list.outputs.changed == 'true'
        uses: helm/kind-action@v1.10.0

      - name: Run chart-testing (install)
        if: steps.list.outputs.changed == 'true'
        run: ct install --config .ct.yaml --skip-tests