apiVersion: v1
kind: Service
metadata:
  name: {{ include "mariadb-galera-ha.fullname" . }}
  labels:
    {{- include "mariadb-galera-ha.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: mysql
      port: {{ .Values.service.port }}
      targetPort: mysql
      protocol: TCP
  selector:
    {{- include "mariadb-galera-ha.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb-galera
