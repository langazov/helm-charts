{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "mariadb-galera-ha.fullname" . }}-backup
  labels:
    {{- include "mariadb-galera-ha.labels" . | nindent 4 }}
    app.kubernetes.io/component: galera-backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "mariadb-galera-ha.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: galera-backup
        spec:
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          serviceAccountName: {{ include "mariadb-galera-ha.serviceAccountName" . }}
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: "{{ .Values.backup.image.repository }}:{{ .Values.backup.image.tag }}"
              imagePullPolicy: IfNotPresent
              env:
                - name: MARIADB_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "mariadb-galera-ha.secretName" . }}
                      key: mariadb-root-password
                {{- if .Values.backup.s3.bucket }}
                - name: S3_BUCKET
                  value: {{ .Values.backup.s3.bucket | quote }}
                - name: S3_ENDPOINT
                  value: {{ .Values.backup.s3.endpoint | quote }}
                {{- if .Values.backup.s3.existingSecret }}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.s3.existingSecret }}
                      key: access-key
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.s3.existingSecret }}
                      key: secret-key
                {{- else }}
                - name: AWS_ACCESS_KEY_ID
                  value: {{ .Values.backup.s3.accessKey | quote }}
                - name: AWS_SECRET_ACCESS_KEY
                  value: {{ .Values.backup.s3.secretKey | quote }}
                {{- end }}
                {{- end }}
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  BACKUP_DIR="/backup/$(date +%Y%m%d-%H%M%S)"
                  mkdir -p "$BACKUP_DIR"
                  echo "[backup] Starting mariabackup to $BACKUP_DIR"
                  mariabackup --backup \
                    --target-dir="$BACKUP_DIR" \
                    --user=root \
                    --password="${MARIADB_ROOT_PASSWORD}" \
                    --host=127.0.0.1 \
                    --port=3306
                  echo "[backup] Preparing backup..."
                  mariabackup --prepare --target-dir="$BACKUP_DIR"
                  echo "[backup] Backup complete: $BACKUP_DIR"
                  {{- if .Values.backup.s3.bucket }}
                  echo "[backup] Syncing to S3..."
                  aws s3 sync "$BACKUP_DIR" "s3://${S3_BUCKET}/$(basename $BACKUP_DIR)/" \
                    {{- if .Values.backup.s3.endpoint }}
                    --endpoint-url "${S3_ENDPOINT}" \
                    {{- end }}
                    --no-progress
                  echo "[backup] S3 sync complete"
                  {{- end }}
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              volumeMounts:
                - name: data
                  mountPath: /var/lib/mysql
                  readOnly: true
                - name: backup-storage
                  mountPath: /backup
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: data-{{ include "mariadb-galera-ha.fullname" . }}-0
            - name: backup-storage
              emptyDir: {}
{{- end }}
