# CI install override used by `ct install`. The chart's default image
# (go-freeradius-radiusd:3.2.10) is built from the upstream Dockerfile at
# freeRADIUS/freeradius-server/go-freeradius/docker/radiusd.Dockerfile and is
# not published to a public registry, so kind-based ct install would hit
# ImagePullBackOff. To validate that the chart's manifests install cleanly in
# a real cluster, swap in a public scratch image that just sleeps, disable
# the probes (which require the real radiusd binary), and skip the helm test
# (which sends a real RADIUS Access-Request only the real image can answer).

image:
  repository: busybox
  tag: "1.36"
  pullPolicy: IfNotPresent

# Override the radiusd ENTRYPOINT so the placeholder container stays alive.
commandOverride:
  - "/bin/sh"
  - "-c"
  - "sleep 3600"

# Probes run `ss -lun | grep :1812` which fails without a real radiusd.
startupProbe:
  enabled: false
livenessProbe:
  enabled: false
readinessProbe:
  enabled: false

# The bundled helm test sends a real RADIUS Access-Request, which the
# busybox placeholder cannot answer.
tests:
  enabled: false
