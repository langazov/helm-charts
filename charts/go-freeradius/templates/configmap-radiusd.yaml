{{- if not .Values.radiusd.existingConfigMap -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "go-freeradius.configMapName" . }}
  namespace: {{ include "go-freeradius.namespace" . }}
  labels:
    {{- include "go-freeradius.labels" . | nindent 4 }}
data:
  radiusd.conf: |
    # Generated by the go-freeradius Helm chart. Do not edit in-cluster —
    # change values.yaml and `helm upgrade`. To take full control, set
    # radiusd.existingConfigMap to your own ConfigMap and this template is
    # skipped.
    max_request_time = {{ .Values.radiusd.max_request_time }}
    cleanup_delay    = {{ .Values.radiusd.cleanup_delay }}
    max_requests     = {{ .Values.radiusd.max_requests }}

    security {
      reject_delay = {{ .Values.radiusd.reject_delay }}
    }
{{- range .Values.radiusd.clients }}

    client {{ .name }} {
      ipaddr = {{ .ipaddr }}
{{- $secret := .secret -}}
{{- if $secret }}
      secret = {{ $secret | quote }}
{{- else }}
      secret = ${env:RADIUS_SECRET}
{{- end }}
    }
{{- end }}

    modules {
{{- range $name := .Values.radiusd.modules.instantiate }}
{{- $cfg := index $.Values.radiusd.moduleConfig $name }}
{{- if $cfg }}
{{ tpl $cfg $ | indent 6 }}
{{- else }}
{{ printf "%s { }" $name | indent 6 }}
{{- end }}
{{- end }}
    }
{{- $auth := index .Values.radiusd.listeners "auth" }}
{{- $acct := index .Values.radiusd.listeners "acct" }}

    server default {
{{- if $auth.enabled }}
      listen {
        type = auth
        ipaddr = {{ $auth.ipaddr }}
        port = {{ $auth.port }}
      }
{{- end }}
{{- if $acct.enabled }}
      listen {
        type = acct
        ipaddr = {{ $acct.ipaddr }}
        port = {{ $acct.port }}
      }
{{- end }}

      authorize {
{{- range .Values.radiusd.modules.authorize }}
        {{ . }}
{{- end }}
      }

      authenticate {
{{- range .Values.radiusd.modules.authenticate }}
        Auth-Type {{ .authType }} {
{{- range .modules }}
          {{ . }}
{{- end }}
        }
{{- end }}
      }

      accounting {
{{- range .Values.radiusd.modules.accounting }}
        {{ . }}
{{- end }}
      }

      post-auth {
{{- range .Values.radiusd.modules.postAuth }}
        {{ . }}
{{- end }}
      }
    }
{{- $status := index .Values.radiusd.listeners "status" }}
{{- if $status.enabled }}

    listen {
      type = status
      ipaddr = {{ $status.ipaddr }}
      port = {{ $status.port }}
      virtual_server = status
    }

    server status {
      authorize {
{{- range .Values.radiusd.modules.status }}
        {{ . }}
{{- end }}
      }
    }
{{- end }}
{{- $coa := index .Values.radiusd.listeners "coa" }}
{{- if $coa.enabled }}

    listen {
      type = coa
      ipaddr = {{ $coa.ipaddr }}
      port = {{ $coa.port }}
      virtual_server = dynamic-authorization
    }

    server dynamic-authorization {
      recv-coa {
{{- range .Values.radiusd.modules.coa }}
        {{ . }}
{{- end }}
      }
      send-coa {
{{- range .Values.radiusd.modules.coa }}
        {{ . }}
{{- end }}
      }
    }
{{- end }}
{{- if .Values.radiusd.tls.enabled }}

    listen {
      type = auth
      transport = tls
      ipaddr = {{ .Values.radiusd.tls.ipaddr }}
      port = {{ .Values.radiusd.tls.port }}
      tls {
        certificate_file = {{ .Values.radiusd.tls.certPath }}
        private_key_file = {{ .Values.radiusd.tls.keyPath }}
      }
    }
{{- end }}
{{- end -}}
