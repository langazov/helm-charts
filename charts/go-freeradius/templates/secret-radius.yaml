{{- if not .Values.radiusd.sharedSecret.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "go-freeradius.secretName" . }}
  namespace: {{ include "go-freeradius.namespace" . }}
  labels:
    {{- include "go-freeradius.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ include "go-freeradius.secretKey" . }}: {{ .Values.radiusd.sharedSecret.value | quote }}
{{- end }}

{{/*
A Secret holding the SQL password for use with an *external* database.
When the MySQL or MariaDB subchart is enabled, that chart emits its own
Secret and the helper `go-freeradius.sqlSecretName` points at it, so we only
render this one when neither subchart is in play.
*/}}
{{- if and (not .Values.mysql.enabled) (not .Values.mariadb.enabled) (not .Values.sql.existingSecret) .Values.sql.password -}}
{{- if not .Values.radiusd.sharedSecret.existingSecret -}}
---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "go-freeradius.sqlSecretName" . }}
  namespace: {{ include "go-freeradius.namespace" . }}
  labels:
    {{- include "go-freeradius.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ include "go-freeradius.sqlSecretKey" . }}: {{ .Values.sql.password | quote }}
{{- end -}}
